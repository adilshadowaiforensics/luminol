:root{--bg:#eef4f5;--panel:#fff;--ink:#172734;--muted:#4b606c;--line:#bfd0d4;--accent:#0b6672;--soft:#e4f1f2;--urgent:#9f3026;--urgentbg:#fff0ed;--rolling:#765008;--rollingbg:#fbf1db;--cloud:#28588b;--cloudbg:#eaf1fa;--ok:#216345;--okbg:#e9f5ee;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#09121b;--panel:#11212d;--ink:#f0f3f8;--muted:#aebccb;--line:#385365;--accent:#80d7df;--soft:#173440;--urgent:#ffafa2;--urgentbg:#3d211f;--rolling:#efd18f;--rollingbg:#352d1d;--cloud:#b0cefa;--cloudbg:#1d3048;--ok:#9cdcb9;--okbg:#1c3529;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;overflow-wrap:anywhere}a{color:var(--accent);text-underline-offset:3px}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}
.mast{background:#0d1621;color:#f1f4f8;border-bottom:2px solid #c99d4c}.mast-inner{max-width:1120px;margin:auto;padding:22px 30px;display:flex;justify-content:space-between;align-items:center;gap:20px}.wordmark{font-size:20px;font-weight:750;letter-spacing:.22em}.maker{color:#e1b968;font-size:12px}.mast button{background:transparent;border:1px solid #8792a2;color:#f1f4f8;padding:8px 16px;border-radius:2px}
main{max-width:1120px;margin:auto;padding:38px 30px 70px}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:11px;font-weight:750;letter-spacing:.15em}.headline{display:flex;justify-content:space-between;gap:30px;align-items:flex-start}h1{font-size:clamp(30px,4vw,44px);line-height:1.13;letter-spacing:-.04em;margin:8px 0 12px;font-weight:700}h2{font-size:24px;letter-spacing:-.02em;line-height:1.25;margin:0}h3{font-size:19px;line-height:1.35;margin:7px 0 12px}p{margin:8px 0 14px}.muted,.small{color:var(--muted)}.small{font-size:12px}.generated{max-width:67ch;color:var(--muted);margin:0 0 22px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-top:3px solid var(--accent);background:var(--panel)}.metric{padding:18px 20px;border-right:1px solid var(--line)}.metric:last-child{border:0}.metric b{font-size:34px;line-height:1.15;display:block;letter-spacing:-.04em}.metric span{font-size:12px;color:var(--muted)}.metric.risk b{color:var(--urgent)}.services{margin:14px 0 0}.chip{display:inline-block;padding:3px 9px;border:1px solid var(--line);border-radius:2px;font-size:12px;font-weight:650;margin:2px 6px 2px 0;background:var(--panel)}.status{background:var(--soft);color:var(--accent);border-color:transparent}.s-urgent{background:var(--urgentbg);color:var(--urgent)}.s-rolling{background:var(--rollingbg);color:var(--rolling)}.s-cloud{background:var(--cloudbg);color:var(--cloud)}.s-stable{background:var(--okbg);color:var(--ok)}
.jump{display:flex;flex-wrap:wrap;gap:8px 24px;padding:16px 0;border-bottom:1px solid var(--line);font-size:13px}.jump a{text-decoration:none;font-weight:650}.section{margin-top:38px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:18px}.section-head span{color:var(--muted);font-size:12px}.scope-note{font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding-left:12px;max-width:95ch}.actions{list-style:none;counter-reset:action;padding:0;margin:18px 0}.actions li{counter-increment:action;display:grid;grid-template-columns:32px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel);padding:16px 20px;margin:8px 0;break-inside:avoid}.actions li::before{content:counter(action,decimal-leading-zero);font:600 14px/1.7 "IBM Plex Mono",Consolas,monospace;color:var(--accent);padding-top:3px}.action-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions p{margin:5px 0 0}.deadline{font-weight:650;color:var(--urgent)}
.snapshot{display:inline-block;margin:0 0 16px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:650}.notice-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.notice-head button{border:1px solid var(--accent);background:var(--soft);color:var(--accent);font-weight:700;padding:8px 14px;border-radius:2px}.notice-text{white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;font:13px/1.6 Consolas,"Cascadia Mono",monospace;margin:18px 0 0;padding:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.evidence{border:1px solid var(--line);background:var(--panel);padding:24px;margin:14px 0}.evidence[data-status=urgent]{border-top:2px solid var(--urgent)}.evidence-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.tool{font-size:13px;font-weight:700;color:var(--muted)}.clock{padding:15px 18px;border-left:2px solid var(--accent);background:var(--soft);margin:18px 0}.clock strong{font-size:18px;line-height:1.4;display:block}.clock p{margin:6px 0 0}.evidence[data-status=urgent] .clock{border-color:var(--urgent);background:var(--urgentbg)}.source-line{font-size:12px;margin:14px 0 0}.source-line a{display:inline-block;margin-right:12px}.basis{font-size:12px;color:var(--muted);margin-top:6px}.evidence-action{font-size:14px;border-top:1px solid var(--line);padding-top:12px}

 h1{font-size:clamp(32px,3vw,42px);font-weight:650;letter-spacing:-.035em;line-height:1.15;margin:12px 0 18px}h2{font-size:26px;font-weight:600;letter-spacing:-.025em}h3{font-weight:600}.eyebrow{font:11px/1.7 "IBM Plex Mono",Consolas,monospace;letter-spacing:.04em}.generated{font-size:12px;line-height:1.8;margin-bottom:22px}.jump{display:none}

<body>
<div class="mast"><div class="mast-inner"><div class="firm-lockup"><svg class="firm-mark" aria-hidden="true" viewBox="0 0 40 40"><path d="M25 3H3v34h34V15M12 11v17h16" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M32 3h5v5h-5z" fill="currentColor"/></svg><div><div class="wordmark">LUMINOL</div><div class="maker">SHADOW AI FORENSICS</div></div></div><button id="print" type="button">Print report</button></div></div>
<div class="report-desk"><aside class="report-index" aria-label="Report navigation"><span>EXAMINATION INDEX</span><a href="#actions">01 / Actions</a><a href="#notice">02 / Draft notice</a><a href="#evidence">03 / Evidence</a><a href="#limits">04 / Limits</a><a href="#sources">05 / Sources</a><a href="#context">06 / Report details</a><small>SAF<br>SHADOW AI FORENSICS<br><br>Known locations.<br>Documented sources.<br>Explicit limits.</small></aside><main>
<header><div class="eyebrow">AI evidence / local check</div><h1>What remains.<br>What needs attention.</h1><p id="generated" class="generated"></p></header>
<div id="report"></div>
<noscript><p>This report needs JavaScript enabled to display its embedded results. It uses no external scripts.</p></noscript>
</main></div>
<script>
"use strict";
const DATA = /*__LUMINOL_DATA__*/null;
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const asArray = x => x == null ? [] : Array.isArray(x) ? x : [x];
const LABEL = {urgent:"At risk soon",rolling:"Disappearing over time",cloud:"In the vendor's cloud",stable:"Stays for now",unknown:"Lifetime not measured",unreliable:"Not a reliable source",likely_gone:"Likely already gone",hold:"Legal hold"};
const KIND = {measured:"Lab measurement",vendor:"Vendor policy",design:"System design"};
const NAMES = {id:"ID",service:"Service",present:"Found",summary:"File summary",files:"Files",bytes:"Bytes",newest:"Newest change",oldest:"Oldest change",locations:"Locations",profiles:"Browser profiles",browser:"Browser",profile:"Profile",readable:"Readable",services:"AI services",modified:"Last changed",files_checked:"Files checked",by_service:"By service",by_type:"By file type",type:"File type",names:"Names",seen_in:"Seen in",note:"Note",overdue:"Older than retention limit",os:"Operating system",name:"Name",version:"Version",build:"Build",powershell:"PowerShell",generated_local:"Time recorded by check",generated_at:"Report time",duration_seconds:"Duration (seconds)",luminol_version:"LUMINOL version",catalog_version:"Catalogue version",schema:"Report schema",not_found:"Not found",could_not_check:"Could not check"};
const fmt = iso => {const date = new Date(iso);return Number.isNaN(date.getTime()) ? String(iso) : date.toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});};
const date = iso => iso ? `<time datetime="${esc(iso)}">${esc(fmt(iso))}</time>` : "";
const safeUrl = value => {try {const u=new URL(value);return ["https:","http:"].includes(u.protocol)?u.href:null;}catch{return null;}};
const keyLabel = k => NAMES[k] || k.replace(/_/g," ").replace(/^./,s=>s.toUpperCase());
function value(v){
 if(v===null || v===undefined)return '<span class="empty">Not supplied</span>';
 if(Array.isArray(v))return v.length?`<ul class="values">${v.map(x=>`<li>${value(x)}</li>`).join("")}</ul>`:'<span class="empty">None</span>';
 if(typeof v==='object')return facts(v);
 if(typeof v==='boolean')return v?'Yes':'No';
 if(typeof v==='string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v))return date(v);
 return esc(v);
}
function facts(obj){return `<dl class="facts">${Object.entries(obj||{}).map(([k,v])=>`<div><dt>${esc(keyLabel(k))}</dt><dd>${value(v)}</dd></div>`).join("")}</dl>`;}
const status = s => `<span class="chip status s-${esc(Object.hasOwn(LABEL,s)?s:'unknown')}">${esc(LABEL[s]||s||'Lifetime not measured')}</span>`;
const section = (id,title,body,aside='') => `<section class="section" id="${id}"><div class="section-head"><h2>${title}</h2>${aside?`<span>${aside}</span>`:''}</div>${body}</section>`;
function render(d){
 const s=d.summary||{}, ev=asArray(d.evidence), sources=asArray(d.sources);
 const absence=typeof d.absence_note==='string'?d.absence_note:'';
 const sourceLink = id => {const i=sources.findIndex(x=>x.id===id);return i<0?esc(id):`<a href="#source-${i}">${esc(id)}</a>`;};
 const lab = `<p class="scope-note">${esc(d.lab_note)}</p>`;
 function evidence(e){
  const c=e.clock, refs=[e.source,...asArray(e.also_sources)].filter(x=>x!=null);
  const kinds=[...new Set(refs.map(id=>sources.find(x=>x.id===id)?.kind).filter(Boolean))];
  const extras=c?Object.fromEntries(Object.entries(c).filter(([k])=>!['status','headline','deadline','detail'].includes(k))):{};
  return `<article class="evidence" data-status="${esc(c?.status||'unknown')}"><div class="evidence-top"><span class="tool">${esc(e.tool)}</span>${e.present===true?status(c?.status):`<span class="chip">${e.present===false?'Looked for, not found':'Could not be checked'}</span>`}</div>
  <h3>${esc(e.evidence)}</h3><p>${esc(e.why)}</p>
  ${c?`<div class="clock">${status(c.status)}<strong>${esc(c.headline)}</strong>${c.deadline?`<p class="deadline">By ${date(c.deadline)}</p>`:''}<p>${esc(c.detail)}</p>${Object.keys(extras).length?facts(extras):''}</div>${lab}`:''}
  ${e.present!==true&&e.result?.note?`<p>${esc(e.result.note)}</p>`:''}
  <p class="source-line"><b>Sources:</b> ${refs.map(sourceLink).join(' ')||'Not supplied'}</p><p class="basis">${kinds.map(k=>esc(KIND[k]||k)).join(' / ')}</p>
  ${e.action?`<p class="evidence-action"><b>${e.present===false?'Catalogue guidance':'Next action'}:</b> ${esc(e.action)}</p>`:''}
  <details class="record-details"><summary>Locations &amp; check details</summary>${facts({id:e.id,service:e.service,...e.result})}${!c?'<p class="small">No lifetime supplied for this item.</p>':''}</details></article>`;
 }
 const settings=d.run_settings?.non_default===true?`Made with non-default settings: ${asArray(d.run_settings.parameters).map(esc).join(', ')}. Do not treat this as a normal check of this computer.`:'';
 document.getElementById('generated').innerHTML=`${settings?`<b role="alert">${settings}</b><br>`:''}${d.sample_data===true?'<b>SAMPLE DATA · Synthetic profile</b><br>':''}${date(d.generated_at)} · ${esc(d.computer?.os?.name)} · Check completed in ${esc(d.duration_seconds)} s`;
 const services=asArray(s.services_seen);
 let html=`<section aria-label="Findings summary"><div class="metrics"><div class="metric"><b>${esc(s.evidence_found)}</b><span>Evidence types found</span></div><div class="metric risk"><b>${esc(s.urgent)}</b><span>At risk soon</span></div><div class="metric"><b>${esc(s.not_found)}</b><span>Looked for, not found</span></div><div class="metric"><b>${esc(s.could_not_check)}</b><span>Not fully checked</span></div></div>${absence&&(Number(s.not_found)>0||Number(s.evidence_found)===0)?`<p class="panel absence-note" role="note">${esc(absence)}</p>`:''}<p class="services"><span class="small">Services seen</span><br>${services.map(x=>`<span class="chip">${esc(x.name)}</span>`).join('')||'<span class="empty">None reported</span>'}</p></section>
 ${s.partial_checks?`<div class="panel" role="alert"><b>Partial check: some evidence was not fully searched.</b><p>Counts and absent findings may be incomplete. Review the limits and problems below.</p><ul>${asArray(d.problems).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}<p class="snapshot">${d.timestamp_requested===true?'Sealed snapshot requested':'No timestamp requested'}</p><nav class="jump" aria-label="Report sections"><a href="#actions">Actions</a><a href="#notice">Preservation notice</a><a href="#evidence">Evidence</a><a href="#limits">Limits</a><a href="#sources">Sources</a><a href="#context">Report details</a></nav>`;
 const actions=asArray(d.actions);
 html+=section('actions','What to do now',lab+(actions.length?`<ol class="actions">${actions.map(a=>`<li><div><div class="action-top"><b>${esc(a.tool)}</b>${status(a.status)}</div><p>${esc(a.text)}</p>${a.deadline?`<p class="deadline">By ${date(a.deadline)}</p>`:''}</div></li>`).join('')}</ol>`:'<p class="panel">No actions were supplied. Review the limits below.</p>'),'In the order reported by the check');
 const notice=String(d.hold_notice?.text||'');
 html+=section('notice','Draft preservation notice',`<div class="panel"><div class="notice-head"><p class="small">A draft for your counsel to adapt. Copy the complete text for review.</p>${notice?'<button id="copy-notice" type="button">Copy notice</button>':''}</div>${notice?`<pre id="notice-text" class="notice-text">${esc(notice)}</pre>`:'<p>No preservation notice was supplied.</p>'}</div>`,'Copyable text supplied with the report');
 html+=section('evidence','Evidence found',ev.filter(e=>e.present===true).map(evidence).join('')||`<p class="panel">No evidence was found in the locations checked. ${esc(absence)}</p>`,'Clock, basis and location for each finding');
 html+=section('unchecked','Could not be checked',ev.filter(e=>e.present===null).map(evidence).join('')||'<p class="panel">No unchecked items were reported.</p>');
 html+=section('absent','Looked for, not found',`${absence?`<p class="panel absence-note">${esc(absence)}</p>`:''}<details class="panel"><summary>Review locations with no finding</summary>${ev.filter(e=>e.present===false).map(evidence).join('')||'<p>None reported.</p>'}</details>`);
 html+=section('limits','What this check cannot answer',`<div class="panel"><ul class="limits">${asArray(d.cannot_answer).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${lab}</div>`);
 html+=section('sources','Where the numbers come from',`${lab}<ol class="sources">${sources.map((x,i)=>{const url=safeUrl(x.url);return `<li id="source-${i}"><div class="source-kind">${esc(KIND[x.kind]||x.kind)}</div><b>${esc(x.id)}</b><p>${esc(x.label)}</p>${url?`<a class="url" href="${esc(url)}" rel="noopener noreferrer">${esc(x.url)}</a>`:x.url?`<span class="url">${esc(x.url)}</span>`:'<span class="small">No external link supplied.</span>'}</li>`;}).join('')}</ol>`);
 html+=section('privacy','How this check works &amp; problems',`<div class="panel"><p>${esc(d.privacy)}</p><h3>Problems reported</h3>${asArray(d.problems).length?`<ul>${asArray(d.problems).map(x=>`<li>${value(x)}</li>`).join('')}</ul>`:'<p class="small">None reported.</p>'}</div>`);
 html+=section('context','Report details',`<details><summary>Where these services were seen</summary>${services.map(x=>facts(x)).join('')||'<p>None reported.</p>'}</details><details class="panel"><summary>Computer, check time and versions</summary>${facts({computer:d.computer,generated_at:d.generated_at,generated_local:d.generated_local,duration_seconds:d.duration_seconds,timestamp_requested:d.timestamp_requested,luminol_version:d.luminol_version,catalog_version:d.catalog_version,schema:d.schema})}</details>`);
 html+=`<footer><div class="eyebrow">Next steps</div><div class="next-grid"><div><h3>Preserve</h3><p>Follow the preservation actions above. LUMINOL Preserve is not available in this version.</p></div><div><h3>Analyse</h3><p>For findings that need investigation, contact <a href="https://shadowaiforensics.com" rel="noopener">Shadow AI Forensics</a>.</p></div><div><h3>Check every computer</h3><p>This check covers this Windows account. Consider the other devices listed in the limits.</p></div></div><p class="version">LUMINOL ${esc(d.luminol_version)} · Catalogue ${esc(d.catalog_version)} · Schema ${esc(d.schema)}</p></footer>`;
 document.getElementById('report').innerHTML=html;
 const copy=document.getElementById('copy-notice');
 if(copy)copy.addEventListener('click',async()=>{try{let copied=false;if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(notice);copied=true;}catch{}}if(!copied){const field=document.createElement('textarea');field.value=notice;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();copied=document.execCommand('copy');field.remove();}copy.textContent=copied?'Copied':'Select the text below to copy';}catch{copy.textContent='Select the text below to copy';}});
}
let printClosed=[];
window.addEventListener('beforeprint',()=>{printClosed=[...document.querySelectorAll('details:not([open])')];printClosed.forEach(x=>x.open=true);});
window.addEventListener('afterprint',()=>{printClosed.forEach(x=>x.open=false);printClosed=[];});
document.getElementById('print').addEventListener('click',()=>window.print());
if(DATA)render(DATA);else document.getElementById('report').innerHTML='<p class="null-note">This is the report template. Run LUMINOL to fill it with the results of a check.</p>';
</script>
</body>
